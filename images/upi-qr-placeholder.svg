<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">UPI QR code placeholder</title>
  <desc id="desc">A clearly marked sample card showing where the store's real UPI QR code should be placed.</desc>
  <rect width="240" height="240" rx="8" fill="#fff"/>
  <rect x="13" y="13" width="214" height="214" rx="4" fill="#f5f4ef" stroke="#c8a464" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="120" cy="91" r="39" fill="#e8dfcd"/>
  <path d="M120 66v50m-25-25h50" stroke="#967640" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="158" fill="#151f2e" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">UPI QR PLACEHOLDER</text>
  <text x="120" y="180" fill="#737a83" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Add your real QR code here</text>
</svg>
